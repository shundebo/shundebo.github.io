<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="麋鹿性癖雷达图测试 - 探索你的亲密关系偏好维度">
  <title>麋鹿终极性癖雷达图 - 进阶版 喵~</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #ff69b4;
      --secondary: #1e90ff;
      --accent: #9d4edd;
      --bg: #0a0a0a;
      --card-bg: #151515;
      --text: #eee;
      --text-secondary: #aaa;
      --border: #333;
      --success: #2ecc71;
      --warning: #f39c12;
    }

    * {
      box-sizing: border-box;
    }

    body { 
      font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 20px;
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(255, 105, 180, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(30, 144, 255, 0.05) 0%, transparent 50%);
    }
    
    h1 { 
      color: var(--primary); 
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.5); 
      font-size: 1.8rem; 
      margin: 0 0 15px 0;
      text-align: center;
      position: relative;
      padding-bottom: 10px;
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 3px;
    }
    
    .container { 
      max-width: 650px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      padding: 25px; 
      border-radius: 20px; 
      border: 1px solid var(--border); 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }
    
    /* 进度条优化 */
    .progress-container { 
      background: #222; 
      height: 8px; 
      border-radius: 4px; 
      margin: 20px 0 10px 0; 
      overflow: hidden; 
    }
    
    #progressFill { 
      height: 100%; 
      width: 0%; 
      background: linear-gradient(90deg, var(--primary), var(--secondary)); 
      transition: width 0.3s ease;
      border-radius: 4px;
      position: relative;
    }
    
    #progressFill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    #progressText { 
      font-size: 0.9rem; 
      color: var(--text-secondary); 
      margin-bottom: 10px; 
      display: flex;
      justify-content: space-between;
    }
    
    #progressPercentage {
      font-weight: bold;
      color: var(--primary);
    }
    
    .question { 
      font-size: 1.2rem; 
      min-height: 3.6rem; 
      margin: 20px 0; 
      font-weight: 500;
      line-height: 1.5;
    }
    
    .options { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 20px;
    }
    
    .options label { 
      background: #202020; 
      padding: 16px 20px; 
      border-radius: 12px; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      border: 1px solid var(--border); 
      position: relative;
      overflow: hidden;
    }
    
    .options label:hover { 
      background: #282828; 
      border-color: var(--primary); 
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2);
    }
    
    .options input { 
      display: none; 
    }
    
    .options input:checked + span { 
      color: var(--primary); 
      font-weight: bold; 
    }
    
    .options input:checked + span::before { 
      content: '✓ '; 
    }
    
    .options input:checked ~ .option-indicator {
      opacity: 1;
      transform: translateX(0);
    }
    
    .option-indicator {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: all 0.3s ease;
      color: var(--primary);
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .nav { 
      margin-top: 35px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    button { 
      padding: 12px 28px; 
      font-size: 1rem; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: all 0.2s; 
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    #prevBtn { 
      background: #333; 
      color: #ccc; 
    }
    
    #prevBtn:disabled { 
      opacity: 0.3; 
      cursor: not-allowed; 
    }
    
    #generateBtn { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
    }
    
    #generateBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
    }
    
    #radarContainer { 
      display: none; 
      max-width: 800px; 
      margin: 40px auto; 
      padding: 25px; 
      background: var(--card-bg); 
      border-radius: 20px; 
      border: 1px solid #444; 
    }
    
    #resultHeader { 
      font-size: 1.5rem; 
      color: var(--secondary); 
      margin-bottom: 15px;
      text-align: center;
      padding: 10px;
      background: rgba(30, 144, 255, 0.1);
      border-radius: 10px;
      border-left: 4px solid var(--secondary);
    }
    
    #resultDesc { 
      color: var(--text-secondary); 
      font-size: 1rem; 
      margin-bottom: 20px; 
      line-height: 1.8; 
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }
    
    .reset-link { 
      color: #555; 
      text-decoration: none; 
      font-size: 0.85rem; 
      cursor: pointer; 
      margin-top: 20px; 
      display: block;
      text-align: center;
      transition: color 0.2s;
    }
    
    .reset-link:hover { 
      color: var(--primary); 
      text-decoration: underline;
    }
    
    .footer-note {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }
    
    .dimension-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 20px;
      font-size: 0.85rem;
    }
    
    .dimension-item {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      text-align: center;
    }
    
    /* 加载动画 */
    .loader {
      display: none;
      width: 40px;
      height: 40px;
      margin: 20px auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .container { padding: 20px; border-radius: 15px; }
      h1 { font-size: 1.5rem; }
      .question { font-size: 1.1rem; }
      button { padding: 10px 20px; }
      .options label { padding: 14px 18px; }
    }
    
    @media (max-width: 480px) {
      .nav { flex-direction: column; gap: 15px; }
      #prevBtn, #generateBtn { width: 100%; }
      .dimension-list { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

    {q:"60. 事后轻度羞辱（「刚刚那么浪」）？",opts:["脸红想否认","会更兴奋想再来","必须重度羞辱才爽","不喜欢被说"]},
    {q:"61. 一次性很久很久，还是短时间多次？",opts:["一次很久很满足","短时间多次更爽","一直做到天亮","随便都行"]},
    {q:"62. 被操到走不动路？",opts:["怕疼不想","有点期待","必须这样才算完","不喜欢太激烈"]},
    {q:"63. 被抱起来边走边插？",opts:["太难了吧","超级有被占有感","必须试一次","没兴趣"]},
    {q:"64. 被抵在墙上做？",opts:["浪漫但不实用","很刺激想试","最喜欢这个场景","不喜欢站着做"]},
    {q:"65. 哪个场景最有感觉？",opts:["床上最安全","办公桌/厨房","浴室湿身play","随便哪里都行"]},
    {q:"66. 冬天闷热被窝 vs 夏天汗湿黏腻？",opts:["冬天温暖更喜欢","夏天汗湿更色","两者都爱","没区别"]},
    {q:"67. 对气味癖（原味）？",opts:["完全不能接受","轻微体味可以","腋下/私处原味很兴奋","必须闻才爽"]},
    {q:"68. 对方穿你的衣服/内裤？",opts:["觉得可爱","瞬间兴奋想扑","必须穿我的内衣才行","没感觉"]},
    {q:"69. 对方用你的丝袜/内裤自慰给你看？",opts:["太羞耻不行","超级刺激想看","必须边看边玩","不感兴趣"]},
    {q:"70. 最后：你希望被怎么对待？",opts:["温柔宠爱到融化","激烈但有底线","狠狠地、彻底地、毫无保留地弄坏","随便怎么都行"]}
  ];

  // 应用状态
  let currentQuestion = parseInt(localStorage.getItem('milu_idx')) || 0;
  let answers = JSON.parse(localStorage.getItem('milu_ans')) || new Array(questions.length).fill(null);
  let radarChart = null;

  // 初始化应用
  function initApp() {
    // 检查是否有警告接受记录
    if (!localStorage.getItem('milu_warning_accepted')) {
      showWarning();
    } else {
      renderQuestion();
    }
  }

  // 显示内容警告
  function showWarning() {
    const warningHTML = `
      <div style="text-align: center; padding: 20px;">
        <h2 style="color: var(--warning); margin-bottom: 20px;">⚠️ 内容警告</h2>
        <p style="margin-bottom: 15px;">本测试包含成人内容，涉及性偏好相关话题。</p>
        <p style="margin-bottom: 25px;">请确保您已年满18岁，并在私密环境下进行测试。</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
          <button onclick="acceptWarning()" style="background: var(--success); color: white; padding: 10px 25px;">
            我已满18岁，继续测试
          </button>
          <button onclick="window.location.href='https://www.google.com'" style="background: #666; color: white; padding: 10px 25px;">
            离开页面
          </button>
        </div>
      </div>
    `;
    
    document.getElementById('questionArea').innerHTML = warningHTML;
    document.getElementById('progressText').style.display = 'none';
    document.getElementById('progressContainer').style.display = 'none';
    document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('generateBtn').style.display = 'none';
    document.querySelector('.reset-link').style.display = 'none';
  }

  // 接受警告
  function acceptWarning() {
    localStorage.setItem('milu_warning_accepted', 'true');
    renderQuestion();
    document.getElementById('progressText').style.display = 'block';
    document.getElementById('progressContainer').style.display = 'block';
    document.getElementById('prevBtn').style.display = 'flex';
    document.getElementById('generateBtn').style.display = 'none';
    document.querySelector('.reset-link').style.display = 'block';
  }

  // 渲染当前题目
  function renderQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('qText').textContent = q.q;
    document.getElementById('currentQuestion').textContent = currentQuestion + 1;
    
    const optionsDiv = document.getElementById('qOptions');
    optionsDiv.innerHTML = '';
    
    q.opts.forEach((opt, idx) => {
      const label = document.createElement('label');
      const checked = answers[currentQuestion] === idx + 1;
      
      label.innerHTML = `
        <input type="radio" name="q" value="${idx+1}" ${checked ? 'checked' : ''}>
        <span>${opt}</span>
        <div class="option-indicator">▶</div>
      `;
      
      label.onclick = () => selectOption(idx + 1);
      optionsDiv.appendChild(label);
    });

    // 更新进度
    updateProgress();
    
    // 更新按钮状态
    document.getElementById('prevBtn').disabled = currentQuestion === 0;
    document.getElementById('generateBtn').style.display = 
      (currentQuestion === questions.length - 1 && answers[currentQuestion]) ? 'flex' : 'none';
  }

  // 更新进度显示
  function updateProgress() {
    const progress = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressPercentage').textContent = `${Math.round(progress)}%`;
  }

  // 选择选项
  function selectOption(val) {
    answers[currentQuestion] = val;
    localStorage.setItem('milu_ans', JSON.stringify(answers));
    localStorage.setItem('milu_idx', currentQuestion);
    
    // 视觉反馈
    const selectedLabel = document.querySelector(`label input[value="${val}"]`).parentElement;
    selectedLabel.style.background = 'rgba(255, 105, 180, 0.15)';
    selectedLabel.style.borderColor = 'var(--primary)';
    
    // 自动前进或显示生成按钮
    if (currentQuestion < questions.length - 1) {
      setTimeout(() => {
        currentQuestion++;
        renderQuestion();
      }, 300);
    } else {
      renderQuestion();
    }
  }

  // 上一题
  document.getElementById('prevBtn').onclick = () => {
    if (currentQuestion > 0) {
      currentQuestion--;
      renderQuestion();
    }
  };

  // 重置测试
  function resetTest() {
    if(confirm("确定要清空进度重新开始吗？喵~")) {
      localStorage.removeItem('milu_idx');
      localStorage.removeItem('milu_ans');
      currentQuestion = 0;
      answers = new Array(questions.length).fill(null);
      renderQuestion();
    }
  }

  // 生成雷达图
  document.getElementById('generateBtn').onclick = () => {
    // 显示加载动画
    document.getElementById('chartLoader').style.display = 'block';
    
    // 延迟执行以确保加载动画可见
    setTimeout(() => {
      generateRadarChart();
      document.getElementById('chartLoader').style.display = 'none';
    }, 100);
  };

  // 生成雷达图和数据
  function generateRadarChart() {
    // 计算维度分数
    const scores = new Array(dimensions.length).fill(0);
    const counts = new Array(dimensions.length).fill(0);

    answers.forEach((val, i) => {
      if (val !== null) {
        const contrib = questionContributions[i] || [];
        contrib.forEach(idx => {
          scores[idx] += val;
          counts[idx]++;
        });
      }
    });

    // 计算平均分
    const avgScores = scores.map((s, i) => 
      counts[i] > 0 ? (s / counts[i]) : 1
    );
    
    // 找出最高分维度
    const maxVal = Math.max(...avgScores);
    const maxIdx = avgScores.indexOf(maxVal);
    
    // 找出前三个维度
    const sortedIndices = avgScores
      .map((score, idx) => ({ score, idx }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);

    // 隐藏测试界面，显示结果
    document.getElementById('quizBox').style.display = 'none';
    const container = document.getElementById('radarContainer');
    container.style.display = 'block';
    
    // 设置结果标题和描述
    document.getElementById('resultHeader').innerHTML = 
      `✨ 你的最强潜质：<strong style="color: var(--primary);">${dimensions[maxIdx]}</strong> (${maxVal.toFixed(2)}/4.0)`;
    
    const description = dimensionDescriptions[dimensions[maxIdx]] || '这是一个特别的偏好维度，反映了你在亲密关系中的独特倾向。';
    
    document.getElementById('resultDesc').innerHTML = `
      <p>🐱 <strong>分析结果：</strong>${description}</p>
      <p>📊 <strong>主要特征：</strong></p>
      <ol style="margin-left: 20px; margin-top: 10px;">
        ${sortedIndices.map((item, i) => 
          `<li><strong>${dimensions[item.idx]}</strong> (${avgScores[item.idx].toFixed(2)}/4.0) - ${dimensionDescriptions[dimensions[item.idx]] || '未找到描述'}</li>`
        ).join('')}
      </ol>
      <p style="margin-top: 15px; font-size: 0.9em; color: #777;">
        * 分数越高表示该维度倾向越强，满分为4.0
      </p>
    `;
    
    // 渲染维度列表
    const dimensionList = document.getElementById('dimensionDetails');
    dimensionList.innerHTML = dimensions.map((dim, idx) => `
      <div class="dimension-item">
        <div style="font-weight: bold; color: ${avgScores[idx] > 3 ? 'var(--primary)' : avgScores[idx] > 2 ? 'var(--secondary)' : 'var(--text)'}">
          ${dim}
        </div>
        <div style="color: ${avgScores[idx] > 3 ? 'var(--primary)' : avgScores[idx] > 2 ? 'var(--secondary)' : '#888'}">
          ${avgScores[idx].toFixed(2)}
        </div>
      </div>
    `).join('');
    
    // 创建雷达图
    const ctx = document.getElementById('radarChart').getContext('2d');
    
    // 如果已有图表实例，先销毁
    if (radarChart) {
      radarChart.destroy();
    }
    
    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: dimensions,
        datasets: [{
          label: '倾向强度',
          data: avgScores,
          backgroundColor: 'rgba(255, 105, 184, 0.2)',
          borderColor: '#ff69b4',
          pointBackgroundColor: (context) => {
            const index = context.dataIndex;
            return avgScores[index] > 3 ? '#ff69b4' : 
                   avgScores[index] > 2.5 ? '#1e90ff' : 
                   avgScores[index] > 2 ? '#9d4edd' : '#666';
          },
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#ff69b4',
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 1,
            max: 4,
            ticks: {
              display: false,
              stepSize: 1,
              backdropColor: 'transparent'
            },
            grid: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            angleLines: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            pointLabels: {
              color: '#888',
              font: {
                size: 11,
                weight: '500'
              }
            }
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return `${context.label}: ${context.raw.toFixed(2)}/4.0`;
              }
            },
            backgroundColor: 'rgba(20, 20, 20, 0.9)',
            titleColor: '#fff',
            bodyColor: '#eee',
            borderColor: '#333',
            borderWidth: 1
          }
        },
        interaction: {
          intersect: false,
          mode: 'nearest'
        },
        animation: {
          duration: 1500,
          easing: 'easeOutQuart'
        }
      }
    });
    
    // 滚动到结果区域
    container.scrollIntoView({ behavior: 'smooth' });
  }

  // 分享结果（模拟功能）
  function shareResults() {
    const resultText = `我在麋鹿性癖雷达图测试中的结果：\n最强潜质维度是【${dimensions[avgScores ? avgScores.indexOf(Math.max(...avgScores)) : 0]}】\n快来测试你的亲密关系偏好吧！`;
    
    if (navigator.share) {
      navigator.share({
        title: '麋鹿性癖雷达图测试结果',
        text: resultText,
        url: window.location.href
      }).catch(err => {
        console.log('分享失败:', err);
        fallbackShare(resultText);
      });
    } else {
      fallbackShare(resultText);
    }
  }

  // 备用分享方法
  function fallbackShare(text) {
    const shareInput = document.createElement('textarea');
    shareInput.value = text + '\n' + window.location.href;
    document.body.appendChild(shareInput);
    shareInput.select();
    document.execCommand('copy');
    document.body.removeChild(shareInput);
    
    alert('结果已复制到剪贴板！你可以粘贴分享给朋友~');
  }

  // 页面加载完成后初始化
  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
