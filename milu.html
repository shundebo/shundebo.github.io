      cursor: pointer;

      border: 1px solid var(--border);
    }

    .options label:hover { 
      background: #252525; 
      border-color: var(--primary);
    }

    .options input { display: none; }

    .options input:checked + span { 
      color: var(--primary);

      justify-content: space-between;

      gap: 15px;

    #radarContainer { 
      display: none; 
      margin: 40px auto; 
      max-width: 800px;
    }

    #resultHeader { 
      font-size: 1.6rem; 
      color: var(--primary); 
      text-align: center; 
      margin-bottom: 20px;
    }

    #dimensionDetails {

  {q:"66. 冬天闷热被窝 vs 夏天汗湿黏腻？",opts:["A. 冬天温暖更喜欢","B. 夏天汗湿更色","C. 两者都爱","D. 没区别"]},
  {q:"67. 对气味癖（原味）？",opts:["A. 完全不能接受","B. 轻微体味可以","C. 腋下/私处原味很兴奋","D. 必须闻才爽"]},
  {q:"68. 对方穿你的衣服/内裤？",opts:["A. 觉得可爱","B. 瞬间兴奋想扑","C. 必须穿我的内衣才行","D. 没感觉"]},
  {q:"69. 对方用你的丝袜/内裤自慰给你看？",opts:["A. 太羞耻不行","B. 超级刺激想看","C. 必须边看边玩","D. 不感兴趣"]},
  {q:"70. 最后：你希望被怎么对待？",opts:["A. 温柔宠爱到融化","B. 激烈但有底线","C. 狠狠地、彻底地、毫无保留地弄坏","D. 随便怎么都行"]}
  ];

  let currentQuestion = parseInt(localStorage.getItem('milu_current') || '0');
  let answers = JSON.parse(localStorage.getItem('milu_answers') || '[]');
  if (answers.length !== questions.length) answers = new Array(questions.length).fill(null);

  function saveProgress() {
    localStorage.setItem('milu_current', currentQuestion);
    localStorage.setItem('milu_answers', JSON.stringify(answers));
  }

  function renderQuestion() {
    if (currentQuestion >= questions.length) currentQuestion = questions.length - 1;
    const q = questions[currentQuestion];
    document.getElementById('qText').textContent = q.q;

    const optsDiv = document.getElementById('qOptions');
    optsDiv.innerHTML = '';

    q.opts.forEach((opt, idx) => {
      const label = document.createElement('label');
      const isChecked = answers[currentQuestion] === idx + 1;
      label.innerHTML = `
        <input type="radio" name="q\( {currentQuestion}" value=" \){idx+1}" ${isChecked ? 'checked' : ''}>
        <span>${opt}</span>
      `;
      label.addEventListener('click', () => {
        answers[currentQuestion] = idx + 1;
        saveProgress();
        updateProgress();
        updateButtons();
      });
      optsDiv.appendChild(label);
    });

    document.getElementById('currentQuestion').textContent = currentQuestion + 1;
    updateProgress();
    updateButtons();
  }

  function updateProgress() {
    const progress = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressPercentage').textContent = Math.round(progress) + '%';
  }

  function updateButtons() {
    document.getElementById('prevBtn').disabled = currentQuestion === 0;
    document.getElementById('nextBtn').style.display = currentQuestion < questions.length - 1 ? 'block' : 'none';
    document.getElementById('generateBtn').style.display = currentQuestion === questions.length - 1 ? 'block' : 'none';
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    }
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      renderQuestion();
    }
  }

  function resetTest() {
    if (confirm("确定要清空所有进度重新开始吗？喵~")) {
      localStorage.removeItem('milu_current');
      localStorage.removeItem('milu_answers');
      currentQuestion = 0;
      answers = new Array(questions.length).fill(null);
      renderQuestion();
    }
  }

  function generateRadar() {
    if (answers.some(a => a === null)) {
      alert("喵~ 还有题目没选完哦~ 请检查所有题目~");
      return;
    }

    document.getElementById('chartLoader').style.display = 'block';

    setTimeout(() => {
      try {
        const scores = new Array(dimensions.length).fill(0);
        const counts = new Array(dimensions.length).fill(0);

        answers.forEach((val, i) => {
          const contrib = questionContributions[i] || [];
          contrib.forEach(idx => {
            scores[idx] += val;
            counts[idx]++;
          });
        });

        const avgScores = scores.map((s, i) => counts[i] > 0 ? Number((s / counts[i]).toFixed(2)) : 1);

        const maxVal = Math.max(...avgScores);
        const maxIdx = avgScores.indexOf(maxVal);

        document.getElementById('resultHeader').innerHTML = 
          `你的最强倾向：<span style="color:var(--primary)">\( {dimensions[maxIdx]}</span> ( \){maxVal}/4.0) 喵~`;

        const detailsDiv = document.getElementById('dimensionDetails');
        detailsDiv.innerHTML = dimensions.map((dim, i) => `
          <div class="dimension-item">
            <div>${dim}</div>
            <div style="color:${avgScores[i]>3?'var(--primary)':avgScores[i]>2?'var(--secondary)':'#888'}">
              ${avgScores[i].toFixed(2)}
            </div>
          </div>
        `).join('');

        const ctx = document.getElementById('radarChart').getContext('2d');
        new Chart(ctx, {
          type: 'radar',
          data: {
            labels: dimensions,
            datasets: [{
              label: '倾向强度',
              data: avgScores,
              backgroundColor: 'rgba(255,105,180,0.15)',
              borderColor: '#ff69b4',
              pointBackgroundColor: '#4169e1',
              pointBorderColor: '#fff',
              borderWidth: 2
            }]
          },
          options: {
            scales: {
              r: {
                min: 1,
                max: 4,
                ticks: { display: false },
                grid: { color: 'rgba(255,255,255,0.08)' },
                angleLines: { color: 'rgba(255,255,255,0.08)' },
                pointLabels: { color: '#aaa', font: { size: 11 } }
              }
            },
            plugins: { legend: { display: false } }
          }
        });

        document.querySelector('.container').style.display = 'none';
        document.getElementById('radarContainer').style.display = 'block';
        document.getElementById('chartLoader').style.display = 'none';
      } catch (e) {
        console.error(e);
        alert("生成雷达图时出现小问题喵~ 请刷新页面重试~");
        document.getElementById('chartLoader').style.display = 'none';
      }
    }, 600);
  }

  // 初始化
  renderQuestion();

  // 按钮绑定
  document.getElementById('nextBtn').onclick = nextQuestion;
  document.getElementById('prevBtn').onclick = prevQuestion;
  document.getElementById('generateBtn').onclick = generateRadar;
</script>
</body>
</html>
