<!DOCTYPE html>
<html lang="zh-CN">

}));

let currentQuestions = null;
let currentQuestion = parseInt(localStorage.getItem('milu_current') || '0');
let answers = JSON.parse(localStorage.getItem('milu_answers') || '[]');

function saveProgress() {
  localStorage.setItem('milu_current', currentQuestion);
  localStorage.setItem('milu_answers', JSON.stringify(answers));
}

function renderQuestion() {
  if (!currentQuestions) return;
  if (currentQuestion >= currentQuestions.length) currentQuestion = currentQuestions.length - 1;
  const q = currentQuestions[currentQuestion];
  document.getElementById('qText').textContent = q.q;
  const optsDiv = document.getElementById('qOptions');
  optsDiv.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const label = document.createElement('label');
    const isChecked = answers[currentQuestion] === idx + 1;
    label.innerHTML = `
      <input type="radio" name="q${currentQuestion}" value="${idx+1}" ${isChecked ? 'checked' : ''}>
      <span>${opt}</span>
    `;
    label.addEventListener('click', () => {
      answers[currentQuestion] = idx + 1;
      saveProgress();
      updateProgress();
      updateButtons();
    });
    optsDiv.appendChild(label);
  });
  document.getElementById('currentQuestion').textContent = currentQuestion + 1;
  updateProgress();
  updateButtons();
}

function updateProgress() {
  if (!currentQuestions) return;
  const progress = ((currentQuestion + 1) / currentQuestions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressPercentage').textContent = Math.round(progress) + '%';
}

function updateButtons() {
  if (!currentQuestions) return;
  document.getElementById('prevBtn').disabled = currentQuestion === 0;
  document.getElementById('nextBtn').style.display = currentQuestion < currentQuestions.length - 1 ? 'block' : 'none';
  document.getElementById('generateBtn').style.display = currentQuestion === currentQuestions.length - 1 ? 'block' : 'none';
}

function nextQuestion() {
  if (currentQuestion < currentQuestions.length - 1) {
    currentQuestion++;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function resetTest() {
  if (confirm("确定要清空所有进度重新开始吗？喵~")) {
    localStorage.removeItem('milu_current');
    localStorage.removeItem('milu_answers');
    localStorage.removeItem('milu_type');
    currentQuestion = 0;
    answers = [];
    currentQuestions = null;
    document.getElementById('quizPage').style.display = 'none';
    document.getElementById('selectPage').style.display = 'block';
  }
}

function generateRadar() {
  if (answers.length < currentQuestions.length || answers.some(a => a == null)) {
    alert("喵~ 还有题目没选完哦~ 请检查所有题目~");
    return;
  }
  document.getElementById('chartLoader').style.display = 'block';
  setTimeout(() => {
    try {
      const scores = new Array(dimensions.length).fill(0);
      const counts = new Array(dimensions.length).fill(0);
      answers.forEach((val, i) => {
        const contrib = questionContributions[i] || [];
        contrib.forEach(idx => {
          scores[idx] += val;
          counts[idx]++;
        });
      });
      const avgScores = scores.map((s, i) => counts[i] > 0 ? Number((s / counts[i]).toFixed(2)) : 1);
      const maxVal = Math.max(...avgScores);
      const maxIdx = avgScores.indexOf(maxVal);
      document.getElementById('resultHeader').innerHTML =
        `你的最强倾向：<span style="color:#ff69b4">${dimensions[maxIdx]}</span> (${maxVal}/4.0) 喵~`;
      document.getElementById('dimensionDetails').innerHTML = dimensions.map((dim, i) => `
        <div class="dimension-item">
          <div>${dim}</div>
          <div style="color:${avgScores[i]>3?'#ff69b4':avgScores[i]>2?'#1e90ff':'#888'}">${avgScores[i].toFixed(2)}</div>
        </div>
      `).join('');
      const ctx = document.getElementById('radarChart').getContext('2d');
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: dimensions,
          datasets: [{
            label: '倾向强度',
            data: avgScores,
            backgroundColor: 'rgba(255,105,180,0.15)',
            borderColor: '#ff69b4',
            pointBackgroundColor: '#4169e1',
            pointBorderColor: '#fff',
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            r: {
              min: 1,
              max: 4,
              ticks: { display: false },
              grid: { color: 'rgba(255,255,255,0.08)' },
              angleLines: { color: 'rgba(255,255,255,0.08)' },
              pointLabels: { color: '#aaa', font: { size: 11 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
      document.getElementById('selectPage').style.display = 'none';
      document.getElementById('quizPage').style.display = 'none';
      document.getElementById('radarContainer').style.display = 'block';
      document.getElementById('chartLoader').style.display = 'none';
    } catch (e) {
      console.error(e);
      alert("生成雷达图时出现小问题喵~ 请刷新重试~");
      document.getElementById('chartLoader').style.display = 'none';
    }
  }, 600);
}
